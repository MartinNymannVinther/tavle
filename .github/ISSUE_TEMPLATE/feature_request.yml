name: Idea
description: Something Tavle could do that it does not do yet.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: >-
        Tavle keeps its concept count deliberately low — board, column,
        card, sprint, comment, person, release, epic, feature, theme,
        area — and the omissions are part of the product. An idea that
        earns a new concept has to be worth it, so say what problem it
        solves before what it should look like.
  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: What are you trying to do today, and what makes it hard?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What could Tavle do about it
    validations:
      required: true
